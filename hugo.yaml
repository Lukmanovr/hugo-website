baseURL: "https://rustam-lukmanov.com"
title: Rustam Lukmanov
theme: PaperMod

defaultContentLanguage: en
languages:
  en:
    weight: 1
    params:
      title: Rustam Lukmanov

pagination:
  pagerSize: 100 # effectively unpaginated - the lists are short

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

markup:
  goldmark:
    renderer:
      unsafe: true # allows raw HTML/JS in markdown (iframe demos)
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # required by fastsearch

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # enables opengraph, twitter-cards and schema
  title: Rustam Lukmanov
  description: "Rustam Lukmanov — Associate Professor and Deputy Director of the AI Institute at Innopolis University. Machine learning for graph-structured data; Ph.D. in physics, University of Bern."
  keywords: [Blog, Portfolio, Rustam Lukmanov]
  author: Lukmanov R.A.
  images: ["/Profile.webp"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # follows OS preference on first visit
  disableThemeToggle: false # sun/moon on-off switch in the header
  stickyHeader: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    theme_color: "#16140f"
    favicon: "/circle4.webp"
    favicon16x16: "/circle4.webp"
    favicon32x32: "/circle4.webp"
    apple_touch_icon: "/circle4.webp"
    safari_pinned_tab: "/circle4.webp"

  label:
    text: "RL"

# home_info mode drives the homepage (profileMode stays off — the Vanta
  # background and hero live in the home_info partial override)
  homeInfoParams:
    Title: "Rustam Lukmanov"
    Content: |
      I work on artificial intelligence — teaching machines to make sense of complex, interconnected data on their own.

      I am an Associate Professor and Deputy Director of the AI Institute at Innopolis University. My research develops scalable, principled machine-learning methods for the unsupervised analysis of graph-structured data — finding patterns in the kind of data where things are defined by their connections.

      Before that: a Ph.D. in experimental physics from the University of Bern, advised by Prof. Peter Wurz, and an M.Sc. and B.Sc. from Saint Petersburg State University.

      [Google Scholar](https://scholar.google.ch/citations?user=uJXEpcgAAAAJ&hl=en&oi=ao) · [GitHub](https://github.com/Lukmanovr) · [LinkedIn](https://www.linkedin.com/in/rustam-lukmanov-604695100/) · [mail@rustam-lukmanov.ru](mailto:mail@rustam-lukmanov.ru)

  socialIcons:
    - name: googlescholar
      url: "https://scholar.google.ch/citations?user=uJXEpcgAAAAJ&hl=en&oi=ao"
    - name: github
      url: "https://github.com/Lukmanovr"
    - name: linkedin
      url: "https://www.linkedin.com/in/rustam-lukmanov-604695100/"
    - name: email
      url: "mailto:mail@rustam-lukmanov.ru"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: true # editorial text rows on list pages, no thumbnails
    hiddenInSingle: false # covers still show on the post itself

  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: Posts
      name: Posts
      url: /posts/
      weight: 20
    - identifier: Publications
      name: Publications
      url: /publications/
      weight: 50
    - identifier: CV
      name: CV
      url: /CV/
      weight: 60
    - identifier: Contact
      name: Contact
      url: /contact/
      weight: 70
    - identifier: Search
      name: Search
      url: /search/
      weight: 80
