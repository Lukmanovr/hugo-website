<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Python REPL (PyScript)</title>
  <!-- PyScript, pinned release -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
  <style>
    /* light document: PyScript's CodeMirror editor ships a light theme,
       so the page around it is warm paper for coherent, readable colors */
    body {
      margin: 0;
      padding: 16px;
      background: #faf9f6;
      color: #26251e;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: 15px;
    }
    p.hint {
      margin: 0 0 12px;
      color: rgb(38 37 30 / 0.6);
    }
    .py-editor-box, mpy-editor, py-editor {
      background: #ffffff;
    }
  </style>
</head>
<body>
  <p class="hint">Paste your code into the editor and press the run button in its corner. The first run downloads the Python runtime (a few seconds).</p>
  <script type="py-editor">
def twoSum(nums, target):
    nums_index = [(v, index) for index, v in enumerate(nums)]
    nums_index.sort()
    begin, end = 0, len(nums) - 1
    while begin < end:
        curr = nums_index[begin][0] + nums_index[end][0]
        if curr == target:
            return [nums_index[begin][1], nums_index[end][1]]
        elif curr < target:
            begin += 1
        else:
            end -= 1

print(twoSum([4, 2, 5, 2, 3, 7, 4, 8], 6))
  </script>
</body>
</html>
